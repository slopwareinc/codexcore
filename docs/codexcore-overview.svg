<svg xmlns="http://www.w3.org/2000/svg" width="920" height="260" viewBox="0 0 920 260" role="img" aria-labelledby="title desc">
  <title id="title">CodexCore architecture overview</title>
  <desc id="desc">A compact flow diagram showing an app using CodexCore and optional CodexCoreUI to talk to the Codex app-server.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2f7"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .label { font-size: 19px; font-weight: 700; }
      .sub { font-size: 13px; fill: #475569; }
      .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.4; rx: 14; }
      .accent { fill: #f1f5ff; stroke: #93a4e8; }
      .line { stroke: #64748b; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .soft { fill: #f8fafc; stroke: #dbe3ee; }
    </style>
  </defs>
  <rect width="920" height="260" rx="24" fill="url(#bg)"/>
  <rect x="36" y="48" width="164" height="88" class="box"/>
  <text x="118" y="85" text-anchor="middle" class="label">Your App</text>
  <text x="118" y="111" text-anchor="middle" class="sub">state, auth, actions</text>
  <rect x="274" y="34" width="178" height="74" class="box accent"/>
  <text x="363" y="66" text-anchor="middle" class="label">CodexCoreUI</text>
  <text x="363" y="91" text-anchor="middle" class="sub">workspace, cards, theme</text>
  <rect x="274" y="152" width="178" height="74" class="box"/>
  <text x="363" y="184" text-anchor="middle" class="label">CodexCore</text>
  <text x="363" y="209" text-anchor="middle" class="sub">client, store, tools</text>
  <rect x="532" y="48" width="164" height="88" class="box"/>
  <text x="614" y="85" text-anchor="middle" class="label">Transport</text>
  <text x="614" y="111" text-anchor="middle" class="sub">stdio or websocket</text>
  <rect x="760" y="48" width="124" height="88" class="box soft"/>
  <text x="822" y="85" text-anchor="middle" class="label">Codex</text>
  <text x="822" y="111" text-anchor="middle" class="sub">app-server</text>
  <path d="M 200 82 C 230 70, 244 70, 274 70" class="line"/>
  <path d="M 200 116 C 230 158, 244 188, 274 188" class="line"/>
  <path d="M 452 188 C 493 173, 503 122, 532 104" class="line"/>
  <path d="M 696 92 L 760 92" class="line"/>
  <path d="M 532 128 C 485 160, 469 188, 452 188" class="line"/>
  <text x="492" y="242" text-anchor="middle" class="sub">notifications, snapshots, turns, dynamic tools, approvals</text>
</svg>
