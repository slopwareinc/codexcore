[workspace]
members = [
    "rust/crates/codex-app-server-adapter",
    "rust/crates/codex-app-server-client",
    "rust/crates/codex-app-server-history",
    "rust/crates/codex-app-server-interaction",
    "rust/crates/codex-app-server-lease",
    "rust/crates/codex-app-server-state",
    "rust/crates/codex-app-server-transport",
    "rust/crates/codex-app-server-types",
    "rust/crates/codex-app-server-wire",
    "rust/crates/codex-app-server-sdk",
]
resolver = "3"

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
repository = "https://github.com/slopwareinc/codexcore"
authors = ["Slopware Inc."]

[workspace.dependencies]
bytes = "=1.10.1"
futures-util = "=0.3.34"
nix = { version = "=0.31.3", features = ["process", "signal"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
tempfile = "=3.27.0"
thiserror = "=2.0.18"
tokio = { version = "=1.53.1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "=0.30.0", features = ["rustls-tls-native-roots"] }
typify = "=0.7.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
