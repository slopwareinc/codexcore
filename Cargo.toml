[workspace]
members = [
    "rust/crates/codex-app-server-state",
    "rust/crates/codex-app-server-transport",
    "rust/crates/codex-app-server-types",
    "rust/crates/codex-app-server-wire",
]
resolver = "3"

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
repository = "https://github.com/slopwareinc/codexcore"
authors = ["Slopware Inc."]

[workspace.dependencies]
bytes = "=1.10.1"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
thiserror = "=2.0.18"
typify = "=0.7.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
