name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer

      - name: Build
        run: swift build

      - name: Test (exclude live probes)
        run: |
          swift test \
            --skip CodexCoreTests.CodexClientTerminalTests/testRealCodexAppServerTurnLifecycle \
            --skip CodexCoreUITests.LiveSubagentProbeTests/testRealAppServerSubagentNotifications

      - name: Check protocol drift
        run: |
          if command -v codex >/dev/null 2>&1 || [ -n "${CODEX_BINARY:-}" ]; then
            Tools/check_drift.sh
          else
            echo "Skipping drift check: codex binary not available"
          fi
